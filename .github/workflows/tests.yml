name: tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install ruff
        run: python -m pip install --upgrade pip ruff
      - name: Run ruff
        run: ruff check .
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy pandas
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Check data health and lineage
        if: matrix.python-version == '3.12'
        run: python tools/health.py --check
  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy pandas coverage
      - name: Run tests under coverage
        run: coverage run -m unittest discover -s tests -v
      - name: Report coverage
        run: |
          coverage report -m
          coverage report -m | grep TOTAL | awk '{print "Coverage: " $NF}' >> $GITHUB_STEP_SUMMARY
  research-artifacts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install artifact verification dependencies
        run: python -m pip install numpy pandas
      - name: Verify original simulation checkpoints and provenance
        run: OPENBLAS_NUM_THREADS=1 python tools/check_inference_audit.py
      - name: Verify independent validation and all paired bootstrap intervals
        run: OPENBLAS_NUM_THREADS=1 python tools/check_bootstrap_null_validation.py
      - name: Verify the separate weak-measurement stress study
        run: OPENBLAS_NUM_THREADS=1 python tools/check_bootstrap_weak_measurement.py
      - name: Verify stress-study public data and methods bindings
        run: |
          OPENBLAS_NUM_THREADS=1 python tools/export_weak_measurement_audit.py --check
          OPENBLAS_NUM_THREADS=1 python tools/build_weak_measurement_note.py --check
